[env:m5stack-atoms3]
platform = espressif32@7.1.3
board = m5stack-atoms3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
extra_scripts = pre:scripts/pio_stage_courses.py, post:scripts/pio_native_mklittlefs.py
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -std=gnu++17
lib_deps =
  https://github.com/M5Stack/M5Unified.git#8b63555e7bd9ac71978c55ad868fd1d1d3b2ef3e
  https://github.com/M5Stack/M5GFX.git#b863d50dd3ca57b65c61a468001925fee70b3e05
